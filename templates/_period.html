{# Davr tanlash: faqat ikkita sana; o'zgarishi bilan sahifa yangilanadi. `action` — forma manzili. #}
<form class="period" method="get" action="{{ action }}" id="periodForm">
  <input class="btn" type="date" name="dan" value="{{ p.start }}" aria-label="Dan" required>
  <span class="muted">—</span>
  <input class="btn" type="date" name="gacha" value="{{ p.end }}" aria-label="Gacha" required>
  {% if extra_params %}{% for k, v in extra_params.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}{% endif %}
  <noscript><button class="btn primary" type="submit">Ko'rsatish</button></noscript>
  <span class="range-err" id="rangeErr" hidden>«Dan» sanasi «Gacha»dan keyin bo'lmasin.</span>
</form>
<script>
(() => {
  const f = document.getElementById("periodForm");
  f.querySelectorAll("input[type=date]").forEach(i => i.addEventListener("change", () => {
    const a = f.dan.value, b = f.gacha.value;
    if (!a || !b) return;
    if (a > b) { document.getElementById("rangeErr").hidden = false; return; }
    f.submit();
  }));
})();
</script>
