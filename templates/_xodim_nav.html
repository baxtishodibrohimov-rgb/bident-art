<div class="bar">
  <nav class="subnav">
    {% for href, name in [("/xodimlar", "Xodimlar va maosh"), ("/grafik", "Grafik"), ("/vazifalar", "Xodim vazifalari")] %}
      <a href="{{ href }}{% if q is defined and href != '/vazifalar' %}?{{ q }}{% endif %}" class="{{ 'on' if request.url.path == href }}">{{ name }}</a>
    {% endfor %}
  </nav>
  {{ gear|default('')|safe }}
</div>
